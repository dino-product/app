name: Native build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Gemfile'
      - 'Gemfile.lock'

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS Release (device, 서명 없이 컴파일만)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: npm ci
      - run: bundle exec pod install
        working-directory: ios
      - name: xcodebuild
        run: |
          xcodebuild \
            -workspace ios/DinoApp.xcworkspace \
            -scheme DinoApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

  android:
    name: Android Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      # Play 에 올리는 AAB 도 함께 만든다. 한 번에 돌려 JS 번들·컴파일 결과를 APK 와 나눠 쓴다 (#57)
      - run: ./gradlew assembleRelease bundleRelease --no-daemon
        working-directory: android
      # CI 에는 업로드 키 속성이 없으니 release AAB 는 debug 키로 서명돼야 한다 (#57)
      - name: AAB 가 debug 키로 서명됐는지 확인
        run: |
          sha256() { awk '/SHA256:/ && !found { print $2; found = 1 }'; }
          debug=$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | sha256)
          aab=$(keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | sha256)
          echo "debug.keystore  $debug"
          echo "app-release.aab $aab"
          test -n "$debug" && test "$debug" = "$aab"
