apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * 푸시 (#118). Firebase 설정 파일(google-services.json)은 저장소에 넣지 않는다. 이 폴더(android/app)에 있을 때만 플러그인을 건다.
 * 없으면(CI 등) Firebase 기본 앱이 만들어지지 않고, JS 가 그것을 보고 푸시만 끈다
 */
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn("google-services.json 이 없어 푸시 없이 빌드한다 (#118)")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * API 서버 주소(ORBIT_API_BASE_URL)와 웹 개발·운영 선택(DEVELOP_ONLY, #192)은 babel 이 JS 번들에 넣는다 (#110, babel.config.js).
 * 빌드하는 셸의 환경 변수를 먼저 보고, 없으면 ~/.gradle/gradle.properties(CI 는 ORG_GRADLE_PROJECT_<이름>)의 같은 이름 속성을 쓴다.
 * iOS 의 ios/.xcode.env.local 자리다. 값이 없으면 Release 의 서버 요청이 모두 설정 오류로 실패한다 (src/shared/api/config.ts).
 * 값은 번들러(node) 앞에 env 로 붙여 번들 작업에만 넘긴다. react { nodeExecutableAndArgs } 는 모든 라이브러리 codegen 의
 * 입력이기도 해서, 거기 넣으면 값이 바뀔 때마다 네이티브를 다시 빌드한다.
 * 번들 작업의 입력이라 값만 바꿔 빌드해도 다시 번들을 만든다 (그렇지 않으면 UP-TO-DATE 로 옛 값이 남는다)
 */
def bundleBuildValues = ["ORBIT_API_BASE_URL", "DEVELOP_ONLY"].collectEntries { name ->
    [(name): (System.getenv(name) ?: findProperty(name)?.toString() ?: "").trim()]
}
tasks.matching { it.name.startsWith("createBundle") }.configureEach {
    inputs.property("orbitApiBaseUrl", bundleBuildValues.ORBIT_API_BASE_URL)
    inputs.property("developOnly", bundleBuildValues.DEVELOP_ONLY)
}
// 번들 작업은 react 플러그인이 onVariants 에서 만들면서 node 명령을 react {} 값으로 정한다. 그보다 뒤에 덮어써야 해서
// 같은 onVariants 에서 이름으로 고친다 (위 configureEach 에서 고치면 플러그인 설정이 나중에 돌아 [node] 로 되돌아간다)
def bundleEnv = bundleBuildValues.findAll { it.value }.collect { "${it.key}=${it.value}".toString() }
androidComponents {
    onVariants(selector().all()) { variant ->
        def bundleTask = "createBundle${variant.name.capitalize()}JsAndAssets"
        if (bundleEnv && tasks.names.contains(bundleTask)) {
            tasks.named(bundleTask).configure { nodeExecutableAndArgs.set(["env"] + bundleEnv + ["node"]) }
        }
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Play 업로드 키 (#57). 값은 ~/.gradle/gradle.properties 나 CI 비밀값(ORG_GRADLE_PROJECT_<이름>)에서 읽고
 * 저장소에는 넣지 않는다. 넷 다 없으면 release 도 debug 키로 서명한다. 그 빌드는 Play 가 받지 않는다.
 * 절차는 docs/play-store.md
 */
def uploadKeyProperties = [
    "ORBIT_UPLOAD_STORE_FILE",
    "ORBIT_UPLOAD_STORE_PASSWORD",
    "ORBIT_UPLOAD_KEY_ALIAS",
    "ORBIT_UPLOAD_KEY_PASSWORD",
]
// 빈 값(설정하지 않은 CI 비밀값)은 없는 것으로 본다
def uploadKey = uploadKeyProperties.collectEntries { [(it): findProperty(it)?.toString()?.trim()] }.findAll { it.value }
def missingUploadKeyProperties = uploadKeyProperties - uploadKey.keySet()
if (uploadKey && missingUploadKeyProperties) {
    throw new GradleException("업로드 키 속성이 일부만 있다. 넷 다 넣거나 모두 뺀다. 빠진 것: ${missingUploadKeyProperties.join(', ')}")
}
def hasUploadKey = missingUploadKeyProperties.isEmpty()

/**
 * 카카오 네이티브 앱 키 (#113). 저장소에 넣지 않고 ~/.gradle/gradle.properties 나 CI 비밀값
 * (ORG_GRADLE_PROJECT_KAKAO_NATIVE_APP_KEY)에서 읽는다. 없으면 빈 값으로 빌드되고, 실행 중 카카오 로그인만 실패 안내를 띄운다
 */
def kakaoNativeAppKey = findProperty("KAKAO_NATIVE_APP_KEY")?.toString()?.trim() ?: ""

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.dinoproduct.app"
    defaultConfig {
        applicationId "com.dinoproduct.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // 카카오 로그인 리다이렉트 스킴 kakao{앱 키} (AndroidManifest 의 AuthCodeHandlerActivity)
        manifestPlaceholders["kakaoScheme"] = "kakao${kakaoNativeAppKey}"
        // 카카오 로그인 라이브러리의 kakao_strings.xml 예제 키를 앱 리소스로 덮어쓴다 (앱 리소스가 라이브러리보다 먼저다)
        resValue "string", "kakao_app_key", kakaoNativeAppKey
    }
    sourceSets {
        // 폰트 원본은 레포 루트 assets/fonts 한 곳에만 둔다 (iOS 와 공유)
        main { assets.srcDirs += "$rootDir/../assets" }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            release {
                storeFile file(uploadKey.ORBIT_UPLOAD_STORE_FILE)
                storePassword uploadKey.ORBIT_UPLOAD_STORE_PASSWORD
                keyAlias uploadKey.ORBIT_UPLOAD_KEY_ALIAS
                keyPassword uploadKey.ORBIT_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasUploadKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// 카카오맵 SDK v2 (#67). Maven Central 에 없어 카카오 저장소에서 받는다 (apis.map.kakao.com/android_v2 › 지도 시작하기)
repositories {
    maven { url "https://devrepo.kakao.com/nexus/repository/kakaomap-releases/" }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // 작업 위치 지도 (#67). 앱 키는 카카오 로그인과 같은 kakao_app_key 리소스를 쓴다 (위 kakaoNativeAppKey)
    implementation("com.kakao.maps.open:android:2.15.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
